name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the host
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Gate
        run: python tools/gate.py
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path shell.py,desktop.py,server.py,window.py,contour.json,requirements.txt,README.md,ui,tools,docs -DestinationPath dist/popit-shell.zip
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/popit-shell.zip --clobber
        continue-on-error: false
      - name: Create the release if the tag had none
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" dist/popit-shell.zip --title "${{ github.ref_name }}" --notes "Contour shell release, built by CI."
          }
