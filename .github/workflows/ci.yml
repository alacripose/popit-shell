name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the host
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Gate
        run: python tools/gate.py
      - name: Selftest
        run: python tools/gate.py --selftest
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path shell.py,desktop.py,server.py,window.py,contour.json,requirements.txt,README.md,ui,tools,docs -DestinationPath dist/popit-shell.zip
      - uses: actions/upload-artifact@v4
        with:
          name: popit-shell
          path: dist/popit-shell.zip
