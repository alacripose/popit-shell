name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse secrets and personal details
        run: python tools/secrets_gate.py --selftest && python tools/secrets_gate.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the host
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Landing page
        # The published page is built from the stored copy and the pins, never edited by hand.
        # --rebuild is the machine-free path: the readings are already pinned in the copy, so CI
        # proves the committed docs/ regenerates exactly, and the gate refuses a stale page.
        run: python tools/landing.py --rebuild
      - name: Gate
        run: python tools/gate.py
      - name: Selftest
        run: python tools/gate.py --selftest
      - name: Session archive probe
        # The two rebuilt archive apps are measured on a fixture project: the index, the
        # family cache rule, the copy and its named refusals. A live window check is the
        # desk's own act and runs on the machine, not on a runner with no desk.
        run: python tools/session_archive_probe.py --fixture
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path shell.py,desktop.py,server.py,window.py,session_archive.py,contour.json,requirements.txt,README.md,ui,tools,docs -DestinationPath dist/popit-shell.zip
      - uses: actions/upload-artifact@v4
        with:
          name: popit-shell
          path: dist/popit-shell.zip
