<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Popit · Debian archive</title>
<link rel="stylesheet" href="/archive.css" />
</head>
<body>
<main class="shell" data-contour="card">
  <header class="bar" data-contour="card">
    <span class="mark">◆</span>
    <div class="title">
      <h1>Popit archive</h1>
      <p>Debian · live delegation surface</p>
    </div>
    <span id="link" class="pill" data-state="waiting">connecting</span>
    <span id="spinner" class="spinner" hidden aria-label="working"></span>
  </header>

  <section class="grid">
    <section class="feed-wrap">
      <div class="feed-head">
        <span>Conversation</span>
        <span id="count">0 rows</span>
        <button id="jump" type="button" hidden>Jump to live</button>
      </div>
      <div id="feed" class="feed" role="log" aria-live="polite"></div>
    </section>

    <aside class="preview">
      <div class="preview-head"><span>Current turn</span><span id="frame-at">—</span></div>
      <figure>
        <img id="frame" alt="Debian desktop at the current turn" />
        <figcaption id="frame-cap">waiting for the Debian view</figcaption>
      </figure>
      <div class="preview-foot">
        <span id="turn-kind">—</span>
        <span id="mind-state">idle</span>
      </div>
      <section class="wish-panel" aria-label="Current call">
        <div class="wish-head"><span>Call</span><span id="call-clock">no open call</span></div>
        <div id="call-line" class="call-line">A call opens with name, presence, and want.</div>
        <ol id="call-opening" class="call-opening"></ol>
        <ol id="call-queue" class="call-feed"></ol>
      </section>
      <section class="queue" aria-label="Voice queue">
        <div class="queue-head"><span>Voice queue</span><span id="call-mode">in call · natural language</span></div>
        <ol id="queue-roster"></ol>
      </section>
    </aside>
  </section>

  <footer class="composer">
    <span id="notice" role="status"></span>
  </footer>
</main>
<script type="module" src="/archive.js"></script>
<script type="module">
import { loadContour, fillContours } from "/contour.js";
loadContour("/contour.json").then(() => fillContours(document)).catch(() => undefined);
</script>
</body>
</html>
